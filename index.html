<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caramdrôle - Blagues</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="container">
        <header>
            <img src="images/caramdrole-logo.png" alt="Carambar & Co Logo" class="logo">
            <h1>Les Blagues Caramdrôle</h1>
            <p class="tagline">Découvrez nos blagues originales !</p>
        </header>

        <main>
            <div class="blague-wrapper">
                <div class="blague-container">
                    <div id="blague-text">
                        Cliquez sur le bouton pour découvrir une blague !
                    </div>
                </div>
                <button id="blague-btn">Une blague ?</button>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Caramdrôle & Co. Tous droits réservés.</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
